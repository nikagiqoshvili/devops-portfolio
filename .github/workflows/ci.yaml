name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-1-nginx

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: project-1-nginx/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend

      - name: Run backend tests
        run: pytest backend/tests -v

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/30"
            sleep 5
          done

          echo "Application did not become healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test API endpoint
        run: curl --fail http://localhost:8080/api

      - name: Test database endpoint
        run: curl --fail http://localhost:8080/db

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down -v
